<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sales Odontologia – Aparelho</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="lib/common.css">
<style>
  :root{--bg:#eee8ff;--ink:#1d1340;--pur:#6c4cff;--pur-l:#b7a6ff;--gold:#c9993c}
  #stage{background:var(--bg);color:var(--ink)}
  #blobs{position:absolute;inset:-10%}
  #brand{color:var(--ink)}
  #track{position:absolute;top:340px;left:0;height:1120px;display:flex;gap:40px;padding-left:90px}
  .sl{flex:none;width:900px;height:1120px;border-radius:64px;background:#fff;box-shadow:0 30px 80px rgba(60,30,160,.16);
    position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px}
  .sl .pg{position:absolute;top:50px;right:56px;font-size:30px;font-weight:800;color:var(--pur);background:#f1edff;padding:10px 22px;border-radius:30px}
  .sl .big{width:300px;height:300px;margin-bottom:40px}
  .sl .t{font-size:92px}
  .sl .d{font-family:'Inter',sans-serif;font-size:52px;font-weight:500;line-height:1.3;margin-top:34px;color:#3c3366}
  .sl .tagline{position:absolute;bottom:56px;left:0;right:0;font-size:30px;font-weight:800;letter-spacing:6px;color:var(--pur-l)}
  .cover{background:linear-gradient(160deg,#7d5cff,#5233e0);color:#fff}
  .cover .t{font-size:118px}
  .cover .d{color:#e9e3ff;font-size:58px;font-weight:700}
  .cover .swipe{position:absolute;bottom:70px;left:0;right:0;font-size:40px;font-weight:800;letter-spacing:4px}
  .ctaS{background:var(--ink);color:#fff}
  .ctaS .t{font-size:96px}
  .ctaS .t span{color:#e9c56b}
  .ctaS .meta{color:#e8e2ff}
  #dots{position:absolute;top:1500px;left:0;right:0;display:flex;justify-content:center;gap:16px}
  #dots i{width:18px;height:18px;border-radius:12px;background:rgba(29,19,64,.2)}
  #hand{position:absolute;width:140px;height:140px;top:1320px;left:700px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.2))}
</style>
</head>
<body>
<div id="stage">
  <div id="blobs"></div>
  <div id="cam"><div id="track"></div><div id="dots"></div><img id="hand" src="emoji/1f449.png"></div>
  <canvas id="grain" width="540" height="960" style="mix-blend-mode:multiply;opacity:.06"></canvas>
  <div id="flash"></div>
</div>
<script src="lib/anim.js"></script>
<script>
const B=60/110, b=n=>n*B, DUR=b(40)+0.8;
document.getElementById('stage').insertAdjacentHTML('afterbegin',GOLD_DEFS);
$('#stage').insertAdjacentHTML('beforeend',brandHTML());
const TIPS=[
  {e:'1f92b',t:'Existem opções discretas',d:'Aparelhos estéticos e alinhadores transparentes quase não aparecem.'},
  {e:'1f4c6',t:'Manutenção faz parte',d:'As consultas periódicas garantem que o tratamento avance.'},
  {e:'1faa5',t:'Higiene em dobro',d:'Escova, fio dental e passa-fio viram seus melhores amigos.'},
  {e:'1f512',t:'Depois vem a contenção',d:'Ela mantém os dentes no lugar depois do tratamento.'},
];
// slide start beats: cover, 4 tips, CTA
const START=[0,5,11,17,23,29];
$('#track').innerHTML=
  `<div class="sl cover"><img class="big" src="emoji/1f601.png"><div class="x t">Vai colocar aparelho?</div><div class="d">Saiba disso antes 👇</div><div class="swipe">ARRASTE ➜</div></div>`+
  TIPS.map((s,i)=>`<div class="sl"><div class="pg">${i+1}/4</div><img class="big" src="emoji/${s.e}.png"><div class="x t">${s.t}</div><div class="d">${s.d}</div><div class="tagline">SALES ODONTOLOGIA</div></div>`).join('')+
  `<div class="sl ctaS"><div class="x t">Bora alinhar<br>esse <span>sorriso?</span> 😁</div><div id="bdg"></div><div id="wa"></div><div class="meta">@salesodontologia_ · 📍 Curitiba-PR</div></div>`;
$('#bdg').outerHTML=badgeHTML(); $('#wa').outerHTML=waHTML();
$('#dots').innerHTML=START.map(()=>'<i></i>').join('');
emojify($('#stage'));
$$('.sl .x').forEach(el=>{el.style.whiteSpace='normal';});
const grain=makeGrain($('#grain'),71,true);
const SL=$$('.sl'), DOTS=$$('#dots i'), STEP=940;

function render(t){
  const bt=t/B; grain(t);
  $('#blobs').style.background=`radial-gradient(circle at ${30+10*Math.sin(t*.4)}% ${20+6*Math.cos(t*.5)}%,rgba(140,110,255,.35),rgba(140,110,255,0) 40%),
    radial-gradient(circle at ${80+6*Math.cos(t*.3)}% ${80+8*Math.sin(t*.45)}%,rgba(255,170,220,.35),rgba(255,170,220,0) 40%),var(--bg)`;
  // carousel position: spring to each slide
  let idx=0,pos=0;
  START.forEach((s,i)=>{if(i>0){const p=spring(prog(t,b(s)-0.05,0.9));pos+=p;if(bt>=s)idx=i;}});
  $('#track').style.transform=`translateX(${-pos*STEP}px)`;
  $('#cam').style.transform=`scale(${1+pulses(t,START.map(b),0.25,0.025)})`;
  DOTS.forEach((d,i)=>{const on=i===idx;d.style.width=on?'54px':'18px';d.style.background=on?'var(--pur)':'rgba(29,19,64,.2)';});
  // swipe hint: hand drags left right before each change
  const h=$('#hand');let ho=0,hx=0;
  START.slice(1,5).forEach(s=>{const p=prog(bt,s-1.2,1.3);if(p>0&&p<1){ho=Math.sin(Math.PI*p);hx=lerp(0,-360,eInOut(p));}});
  h.style.opacity=ho;h.style.transform=`translateX(${hx}px) rotate(${-10+20*ho}deg)`;

  // per-slide content
  SL.forEach((sl,i)=>{
    const s=START[i];const big=sl.querySelector('.big');
    if(big){pop(big,t,b(s)+0.15,0.5);big.style.transform+=` translateY(${Math.sin(t*4+i)*10}px)`;}
    const tt=sl.querySelector('.t');slam(tt,t,b(s)+0.35,1.5);
    const d=sl.querySelector('.d');if(d)upIn(d,t,b(s)+0.8,0.45,40);
    const sw=sl.querySelector('.swipe');if(sw){sw.style.opacity=t>b(2)?0.6+0.4*Math.sin(t*6):0;sw.style.transform=`translateX(${Math.sin(t*6)*12}px)`;}
    if(i===5){pop(sl.querySelector('.badge'),t,b(s+1.5),0.45);pop(sl.querySelector('.wa'),t,b(s+2.5),0.45);
      waBeat(sl.querySelector('.wa'),bt,s+4.5);upIn(sl.querySelector('.meta'),t,b(s+3.5),0.4,30);}
  });
}
window.render=render;window.DUR=DUR;render(0);
</script>
</body>
</html>
