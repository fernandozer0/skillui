<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sales Odontologia – Perguntas frequentes</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="lib/common.css">
<style>
  :root{--ink:#1c1c1e}
  #stage{color:#fff;background:#ff7a6b}
  #sky{position:absolute;inset:-10%}
  #brand{color:#fff}
  #intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:200px;text-align:center}
  #intro .hand{width:260px;height:260px;margin-bottom:30px}
  #intro .a{font-size:112px;text-shadow:0 10px 40px rgba(80,0,60,.25)}
  #intro .b{font-family:'Inter',sans-serif;font-size:56px;font-weight:700;margin-top:36px}
  .qa{position:absolute;inset:0;perspective:2400px}
  .box{position:absolute;left:110px;right:110px;top:420px;border-radius:48px;background:#fff;color:var(--ink);overflow:hidden;
    box-shadow:0 30px 80px rgba(80,0,60,.25);transform-style:preserve-3d;backface-visibility:hidden}
  .box .hd{background:linear-gradient(90deg,#ff9a5a,#ff4f8b,#a259ff);color:#fff;text-align:center;padding:34px 30px 30px;font-size:38px;font-weight:800;letter-spacing:2px}
  .box .q{padding:56px 54px 60px;text-align:center;font-family:'Inter',sans-serif;font-size:62px;font-weight:700;line-height:1.22;min-height:300px}
  .box .q .cur{display:inline-block;width:5px;height:62px;background:#ff4f8b;vertical-align:-10px;margin-left:4px}
  .ans{position:absolute;left:80px;right:80px;top:1010px;text-align:center}
  .ans .lbl{display:inline-block;font-size:30px;font-weight:800;letter-spacing:8px;background:rgba(255,255,255,.22);padding:12px 26px;border-radius:30px}
  .ans .t{font-size:92px;margin-top:30px;text-shadow:0 10px 40px rgba(80,0,60,.25);text-transform:none;letter-spacing:-2px}
  .count{position:absolute;top:330px;left:0;right:0;text-align:center;font-size:30px;font-weight:800;letter-spacing:8px;opacity:.85}
  #cta{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:200px;text-align:center}
  #cta .big{width:230px;height:230px;margin-bottom:20px}
  #cta .a{font-size:96px;text-shadow:0 10px 40px rgba(80,0,60,.25)}
</style>
</head>
<body>
<div id="stage">
  <div id="sky"></div>
  <div id="cam">
    <div id="intro"><img class="hand" src="emoji/1f64b.png"><div class="x a">Perguntas que<br>a gente mais<br>recebe</div><div class="b">E as respostas 💬</div></div>
    <div id="qas"></div>
    <div id="cta"><img class="big" src="emoji/1f4e9.png"><div class="x a">Ficou alguma<br>dúvida?<br>Manda pra gente!</div><div id="bdg"></div><div id="wa"></div><div class="meta">@salesodontologia_ · 📍 Curitiba-PR</div></div>
  </div>
  <canvas id="grain" width="540" height="960" style="mix-blend-mode:overlay"></canvas>
  <div id="flash"></div>
</div>
<script src="lib/anim.js"></script>
<script>
const B=60/85, b=n=>n*B, DUR=b(35)+0.8;
document.getElementById('stage').insertAdjacentHTML('afterbegin',GOLD_DEFS);
$('#stage').insertAdjacentHTML('beforeend',brandHTML());
$('#bdg').outerHTML=badgeHTML(); $('#wa').outerHTML=waHTML();
const QA=[
  {q:'Vocês atendem todas as especialidades?',a:'Sim! Da limpeza ao implante 🦷✨'},
  {q:'Como faço pra agendar?',a:'É só chamar no WhatsApp 📲'},
  {q:'Onde vocês ficam?',a:'Em Curitiba-PR 📍'},
  {q:'O atendimento é humanizado mesmo?',a:'É a nossa essência: cuidar de você 🤍'},
];
const QS=i=>3+6*i;
$('#qas').innerHTML=QA.map((x,i)=>`<div class="qa" id="qa${i}"><div class="count">PERGUNTA ${i+1} DE 4</div>
  <div class="box"><div class="hd">Faça uma pergunta 💬</div><div class="q"><span class="typed"></span><span class="cur"></span></div></div>
  <div class="ans"><div class="lbl">RESPOSTA</div><div class="x t">${x.a}</div></div></div>`).join('');
emojify($('#stage'));
const grain=makeGrain($('#grain'),91);

function render(t){
  const bt=t/B; grain(t);
  const a=t*0.25;
  $('#sky').style.background=`radial-gradient(circle at ${25+10*Math.sin(a)}% ${20+8*Math.cos(a)}%,#ffb36b 0%,rgba(255,179,107,0) 45%),
    radial-gradient(circle at ${80+8*Math.cos(a*1.2)}% ${55+10*Math.sin(a)}%,#a259ff 0%,rgba(162,89,255,0) 50%),
    linear-gradient(170deg,#ff8a5c 0%,#ff4f8b 55%,#8b4dff 100%)`;
  $('#cam').style.transform=`scale(${1+pulses(t,[0,...QA.flatMap((_,i)=>[b(QS(i)),b(QS(i)+3)]),b(27)],0.25,0.03)})`;
  $('#flash').style.opacity=pulses(t,QA.map((_,i)=>b(QS(i)+3)),0.25,0.3);

  const it=$('#intro');
  if(vis(it,t,0,b(3))){
    const h=$('#intro .hand');pop(h,t,0,0.45);h.style.transform+=` rotate(${Math.sin(t*6)*10}deg)`;
    slam($('#intro .a'),t,b(0.6),1.6); upIn($('#intro .b'),t,b(1.5),0.4,40);
    const x=eIn(prog(t,b(2.5),b(0.5)));if(x>0)tf(it,{o:1-x,y:-x*200});
  }
  QA.forEach((x,i)=>{
    const el=$('#qa'+i), s=QS(i);if(!vis(el,t,b(s),b(s+6)))return;
    upIn(el.querySelector('.count'),t,b(s),0.3,20);
    // card flips in like a turned sticker
    const box=el.querySelector('.box');const pf=prog(t,b(s),0.7);
    const out=eIn(prog(t,b(s+5.5),b(0.5)));
    box.style.opacity=t<b(s)?0:1-out;
    box.style.transform=`rotateY(${lerp(-90,0,spring(pf))+out*90}deg) translateY(${Math.sin(t*2)*6}px)`;
    // typed question
    const n=Math.floor(x.q.length*clamp((bt-s-0.5)/2));
    el.querySelector('.typed').textContent=x.q.slice(0,n);
    el.querySelector('.cur').style.opacity=(n<x.q.length?1:(Math.floor(t*3)%2));
    // answer
    upIn(el.querySelector('.lbl'),t,b(s+3),0.3,30);
    slam(el.querySelector('.ans .t'),t,b(s+3.2),1.5);
    if(out>0)el.querySelector('.ans').style.opacity=1-out;else el.querySelector('.ans').style.opacity=1;
  });
  const ct=$('#cta');
  if(vis(ct,t,b(27),DUR+1)){
    const bg=$('#cta .big');pop(bg,t,b(27),0.45);bg.style.transform+=` translateY(${Math.sin(t*4)*10}px)`;
    slam($('#cta .a'),t,b(27.4),1.5); pop($('#cta .badge'),t,b(28.8),0.45); pop($('#cta .wa'),t,b(29.6),0.45);
    waBeat($('#cta .wa'),bt,31.5); upIn($('#cta .meta'),t,b(30.4),0.4,30);
  }
}
window.render=render;window.DUR=DUR;render(0);
</script>
</body>
</html>
