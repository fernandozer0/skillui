<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sales Odontologia – Trailer</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="lib/common.css">
<style>
  #stage{background:#050505;color:#f2ede4}
  #bg{position:absolute;inset:-10%}
  #leak{position:absolute;inset:0;mix-blend-mode:screen}
  .bar{position:absolute;left:0;right:0;height:250px;background:#000;z-index:5}
  #barT{top:0} #barB{bottom:0}
  #brand{z-index:6;color:rgba(242,237,228,.7)}
  .card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 70px 120px;text-align:center}
  .cin{font-family:'Cinzel',serif;font-weight:700;letter-spacing:10px;line-height:1.25}
  .c1 .cin,.c3 .cin{font-size:82px}
  .c2 .cin{font-size:70px}
  .c2 img{width:200px;height:200px;margin-top:40px}
  .c4 .cin{font-size:120px;color:#e9c56b;text-shadow:0 0 40px rgba(233,197,107,.4)}
  .c5 .pre{font-family:'Cinzel',serif;font-size:40px;letter-spacing:14px;color:#cfc6b6;margin-top:40px}
  .c5 .badge{width:300px;height:300px;margin:0;border-width:8px;box-shadow:0 0 80px rgba(233,197,107,.35)}
  .c5 .badge svg{width:90px;height:60px}
  .c5 .badge .n{font-size:66px;letter-spacing:6px}
  .c5 .badge .s{font-size:15px;letter-spacing:6px}
  .c6 .t{font-family:'Cinzel',serif;font-weight:700;font-size:140px;line-height:1.02;letter-spacing:4px;
    background:linear-gradient(180deg,#fff3c4,#e9c56b 45%,#a8792a 75%,#f3d88f);-webkit-background-clip:text;background-clip:text;color:transparent}
  .c6 .o{font-family:'Cinzel',serif;font-size:50px;letter-spacing:16px;color:#cfc6b6;margin-bottom:10px}
  .c6 .star{font-family:'Inter',sans-serif;font-size:50px;font-weight:600;margin-top:40px;letter-spacing:1px}
  #flare{position:absolute;left:0;top:50%;width:700px;height:6px;margin-top:-80px;background:radial-gradient(ellipse at center,#fff 0%,rgba(255,230,170,.7) 30%,rgba(255,230,170,0) 70%);filter:blur(2px)}
  .c7 .t{font-family:'Cinzel',serif;font-size:76px;font-weight:700;letter-spacing:8px;color:#e9c56b}
  .c7 .s{font-family:'Inter',sans-serif;font-size:48px;font-weight:600;margin-top:20px}
  .c7 .wa{margin-top:40px}
  .c7 .meta{color:#cfc6b6}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div><div id="leak"></div>
  <div id="cam">
    <div class="card c1" id="c1"><div class="cin">EM UM MUNDO…</div></div>
    <div class="card c2" id="c2"><div class="cin">ONDE AS PESSOAS<br>ESCONDEM O SORRISO<br>NAS FOTOS</div><img src="emoji/1fae3.png"></div>
    <div class="card c3" id="c3"><div class="cin">UMA CLÍNICA…</div></div>
    <div class="card c4" id="c4"><div class="cin">VAI MUDAR<br>TUDO.</div></div>
    <div class="card c5" id="c5"><div id="bdg"></div><div class="pre">APRESENTA</div></div>
    <div class="card c6" id="c6"><div class="o">— O —</div><div class="t">SORRISO<br>PERFEITO</div><div class="star">Estrelando: você ⭐</div><div id="flare"></div></div>
    <div class="card c7" id="c7"><div class="t">EM CARTAZ<br>EM CURITIBA 🎬</div><div class="s">Garanta sua sessão 🍿</div><div id="wa"></div><div class="meta">@salesodontologia_</div></div>
  </div>
  <div class="bar" id="barT"></div><div class="bar" id="barB"></div>
  <canvas id="grain" width="540" height="960" style="mix-blend-mode:overlay;opacity:.14;z-index:7"></canvas>
  <div id="flash" style="z-index:8"></div>
</div>
<script src="lib/anim.js"></script>
<script>
const B=0.75, b=n=>n*B, DUR=b(31)+0.8;   // 80 BPM, cinematic
document.getElementById('stage').insertAdjacentHTML('afterbegin',GOLD_DEFS);
$('#stage').insertAdjacentHTML('beforeend',brandHTML());
$('#bdg').outerHTML=badgeHTML(); $('#wa').outerHTML=waHTML();
emojify($('#stage'));
const grain=makeGrain($('#grain'),131);
// card windows in beats: [id, in, out]
const CARDS=[['c1',0,3.6],['c2',4,8.6],['c3',9,11.6],['c4',12,15.6],['c5',16,19.6],['c6',20,25.6],['c7',26,99]];
const BOOMS=[0,4,9,12,16,20,26];

function render(t){
  const bt=t/B; grain(t);
  const a=t*0.2;
  $('#bg').style.background=`radial-gradient(ellipse 60% 40% at ${50+10*Math.sin(a)}% ${45+5*Math.cos(a)}%, rgba(120,90,40,.35), rgba(0,0,0,0) 70%), #050505`;
  // warm light leak drifting across
  $('#leak').style.background=`radial-gradient(circle at ${lerp(-20,120,(t*0.06)%1)*1}% 30%, rgba(255,140,60,.18), rgba(0,0,0,0) 35%)`;
  const push=1+0.06*((bt%4)/4);
  $('#cam').style.transform=`scale(${push+pulses(t,BOOMS.map(b),0.5,0.04)})`;
  $('#flash').style.opacity=pulses(t,[b(12),b(20)],0.35,0.7);
  // letterbox opens slightly for the title
  const lb=bt>=20?lerp(250,200,eOut(prog(bt,20,2))):250;
  $('#barT').style.height=$('#barB').style.height=lb+'px';
  $('#brand').style.opacity=bt>=16&&bt<26?0:0.7;

  CARDS.forEach(([id,a0,a1])=>{
    const el=$('#'+id);if(!vis(el,t,b(a0),b(a1)))return;
    const fin=eInOut(prog(t,b(a0),0.8)), fout=eInOut(prog(t,b(a1)-0.6,0.6));
    tf(el,{o:fin*(1-fout),s:lerp(1.08,1,eOut(prog(t,b(a0),b(4)))),bl:(1-fin)*10+fout*10});
  });
  const em=$('#c2 img');em.style.transform=`translateY(${Math.sin(t*2)*8}px)`;
  // c4 letter-spacing tightens
  $('#c4 .cin').style.letterSpacing=lerp(40,10,eOut(prog(t,b(12),b(3))))+'px';
  // c5 badge glow
  const bd=$('#c5 .badge');bd.style.transform=`scale(${lerp(0.85,1,eOut(prog(t,b(16),b(3))))})`;
  upIn($('#c5 .pre'),t,b(17),0.8,20);
  // c6 title: letter spacing reveal + flare sweep
  const tt=$('#c6 .t');tt.style.letterSpacing=lerp(30,4,eOut(prog(t,b(20),b(3))))+'px';
  const fl=$('#flare');const fp=prog(t,b(20.3),1.6);fl.style.opacity=fp>0&&fp<1?Math.sin(Math.PI*fp):0;fl.style.transform=`translateX(${lerp(-700,1080,eInOut(fp))}px)`;
  upIn($('#c6 .o'),t,b(20),0.8,20);upIn($('#c6 .star'),t,b(22),0.8,30);
  // c7 CTA
  upIn($('#c7 .s'),t,b(27),0.6,30);pop($('#c7 .wa'),t,b(27.5),0.5);waBeat($('#c7 .wa'),bt,29);upIn($('#c7 .meta'),t,b(28.2),0.5,20);
}
window.render=render;window.DUR=DUR;render(0);
</script>
</body>
</html>
