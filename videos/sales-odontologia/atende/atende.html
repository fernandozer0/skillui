<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Doutor, você atende aos sábados?</title>
<link rel="stylesheet" href="../lib/common.css">
<style>
  @font-face{font-family:'Montserrat';font-weight:400 900;src:url(../fonts/Montserrat-900.woff2) format('woff2')}
  @font-face{font-family:'Cinzel';font-weight:500 700;src:url(../fonts/Cinzel-700.woff2) format('woff2')}
  /* photos extended to 9:16 by estender.py (edges stretched, no AI) */
  #stage{background:#000;color:#fff}
  .ph{position:absolute;left:0;top:0;width:1080px;height:1920px}
  /* text sits in the stretched sky above the doctor's head */
  .tx{position:absolute;left:30px;right:30px;bottom:1700px;text-align:center;font-family:'Liberation Serif',serif;font-weight:700;font-size:96px;line-height:1.06;
    text-transform:uppercase;color:#fff;-webkit-text-stroke:12px #000;paint-order:stroke fill;letter-spacing:1px}
  #q{font-size:72px}
  #sim{font-size:150px;-webkit-text-stroke:16px #000}
  #cta{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(ellipse 80% 60% at 50% 40%,#2a2318 0%,#0d0b08 75%)}
  #cta .badge{margin-top:0}
  #cta .h{font-family:'Liberation Serif',serif;font-weight:700;font-size:92px;line-height:1.08;text-transform:uppercase;-webkit-text-stroke:12px #000;paint-order:stroke fill;margin-top:30px}
  #cta .sub{font-family:'Inter',sans-serif;font-weight:700;font-size:44px;margin-top:22px}
</style>
</head>
<body>
<div id="stage">
  <div id="photos"></div>
  <div class="tx" id="q">"Doutor, você atende<br>aos sábados?"</div><div class="tx" id="sim">SIM!</div><div class="tx" id="lbl"></div>
  <div id="cta"><div id="bdg"></div><div class="h">Agende sua<br>avaliação</div><div class="sub">Atendemos todas as especialidades 🦷</div><div id="wa"></div><div class="meta">@salesodontologia_ · 📍 Curitiba-PR</div></div>
  <div id="flash"></div>
</div>
<script>window.EMOJI_DIR='../emoji';</script>
<script src="../lib/anim.js"></script>
<script>
// [photo, label] in the order the user asked for
const SCENES=[['0-original',''],['1-domingo','E no domingo'],['2-natal','No Natal'],['3-ano-novo','No Ano Novo'],['4-dia-santo','No dia santo'],
  ['5-apagao','No apagão'],['6-tempestade','Na tempestade'],['7-neve','Na neve'],['8-enchente','Na enchente']];
// atende.html?cta adds a booking end card after the last scene
const CTA=location.search.includes('cta'), CTA_LEN=3.5;
const INTRO=3.2, STEP=1.5, LAST=INTRO+STEP*(SCENES.length-1), DUR=CTA?LAST+STEP+CTA_LEN:LAST+2.0;
const start=i=>i===0?0:INTRO+STEP*(i-1);
document.getElementById('stage').insertAdjacentHTML('afterbegin',GOLD_DEFS);
$('#bdg').outerHTML=badgeHTML(); $('#wa').outerHTML=waHTML(); emojify($('#cta'));
$('#photos').innerHTML=SCENES.map(([f],i)=>`<img class="ph" id="p${i}" src="fotos-9x16/${f}.jpg">`).join('');

function render(t){
  // hard cut to each photo (shown whole, never zoomed or cropped) with a quick flash
  let cur=0;SCENES.forEach((_,i)=>{if(t>=start(i))cur=i;});
  SCENES.forEach((_,i)=>{$('#p'+i).style.display=i===cur?'':'none';});
  $('#flash').style.opacity=SCENES.slice(1).reduce((m,_,k)=>Math.max(m,0.5*(1-prog(t,start(k+1),0.18))*(t>=start(k+1)?1:0)),0);
  // intro: question, then "SIM!" in the same spot
  const q=$('#q');vis(q,t,0,1.7);slam(q,t,0.1,1.4);
  const sim=$('#sim');vis(sim,t,1.7,INTRO);stamp(sim,t,1.7,-4,0.3);
  // scene labels
  const lb=$('#lbl');
  if(vis(lb,t,INTRO,CTA?LAST+STEP:DUR+1)){lb.textContent=SCENES[cur][1];slam(lb,t,start(cur),1.35,0.18);}
  // booking end card on a plain dark background
  const ct=$('#cta');
  if(CTA&&t>=LAST+STEP){ct.style.display='flex';const c0=LAST+STEP;ct.style.opacity=eOut(prog(t,c0,0.3));
    pop($('#cta .badge'),t,c0+0.05,0.45);slam($('#cta .h'),t,c0+0.3,1.4);upIn($('#cta .sub'),t,c0+0.7,0.4,30);
    pop($('#cta .wa'),t,c0+1.0,0.45);waBeat($('#cta .wa'),t/0.75,(c0+1.6)/0.75);upIn($('#cta .meta'),t,c0+1.3,0.4,30);
  }else ct.style.display='none';
}
window.render=render;window.DUR=DUR;render(0);
</script>
</body>
</html>
